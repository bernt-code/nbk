[build]
  publish = "public"
  functions = "netlify/functions"
  command = "node build.cjs"

[functions]
  node_bundler = "esbuild"

# API redirects — clean URLs for functions
[[redirects]]
  from = "/api/sail-numbers/*"
  to = "/.netlify/functions/sail-numbers/:splat"
  status = 200

[[redirects]]
  from = "/api/vipps/webhook"
  to = "/.netlify/functions/vipps-webhook"
  status = 200

[[redirects]]
  from = "/api/vipps/callback"
  to = "/.netlify/functions/vipps-callback"
  status = 200

[[redirects]]
  from = "/api/shop/products"
  to = "/.netlify/functions/shop-products"
  status = 200

[[redirects]]
  from = "/api/shop/order"
  to = "/.netlify/functions/shop-order"
  status = 200

[[redirects]]
  from = "/api/pod/webhook"
  to = "/.netlify/functions/pod-webhook"
  status = 200

[[redirects]]
  from = "/api/feeds"
  to = "/.netlify/functions/feeds"
  status = 200

[[redirects]]
  from = "/api/register-webhook"
  to = "/.netlify/functions/register-webhook"
  status = 200


[[redirects]]
  from = "/api/membership"
  to = "/.netlify/functions/membership"
  status = 200

[[redirects]]
  from = "/api/membership/*"
  to = "/.netlify/functions/membership/:splat"
  status = 200

[[redirects]]
  from = "/api/legendekopp"
  to = "/.netlify/functions/legendekopp"
  status = 200

[[redirects]]
  from = "/api/legends"
  to = "/.netlify/functions/legends"
  status = 200


[[redirects]]
  from = "/api/setup-webhooks"
  to = "/.netlify/functions/setup-webhooks"
  status = 200

[[redirects]]
  from = "/produkt/*"
  to = "/seilnummer/"
  status = 301

[[redirects]]
  from = "/vilkar-og-betingelser"
  to = "/vilkar/"
  status = 301

[[redirects]]
  from = "/om-nbk"
  to = "/om-oss/"
  status = 301

[[redirects]]
  from = "/bli-medlem"
  to = "/medlemskap/"
  status = 301

# CORS headers for API
[[headers]]
  for = "/api/sail-numbers"
  # Public GET-API — kan kalles fra alle origins (inkl. seilnummer-siden)
  [headers.values]
    Access-Control-Allow-Origin = "https://nbk.no"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

[[headers]]
  for = "/api/membership"
  # Public POST fra medlemskap-siden
  [headers.values]
    Access-Control-Allow-Origin = "https://nbk.no"
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

[[headers]]
  for = "/api/feeds"
  # Public GET
  [headers.values]
    Access-Control-Allow-Origin = "https://nbk.no"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

# Admin og webhook: INGEN CORS-åpning (samme-origin eller server-til-server)
