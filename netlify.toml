[build]
  publish = "public"
  functions = "netlify/functions"
  command = "node build.cjs"

[functions]
  node_bundler = "esbuild"

# API redirects — clean URLs for functions
[[redirects]]
  from = "/api/gelato-uid"
  to = "/.netlify/functions/gelato-uid"
  status = 200

