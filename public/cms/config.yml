backend:
  name: github
  repo: bernt-code/nbk
  branch: main

site_url: https://nbk-no.netlify.app

media_folder: "public/img/uploads"
public_folder: "/img/uploads"

collections:
  # Forside
  - name: "pages"
    label: "Forside"
    files:
      - label: "Forside"
        name: "forside"
        file: "public/content/pages/home.json"
        fields:
          - { label: "Hero tittel", name: "hero_title", widget: "string" }
          - { label: "Hero undertittel", name: "hero_subtitle", widget: "string" }
          - { label: "Hero badge", name: "hero_badge", widget: "string" }
          - { label: "Hero bilde", name: "hero_image", widget: "image" }
          - { label: "Hero CTA tekst", name: "hero_cta_text", widget: "string" }
          - { label: "Hero sekundaer CTA", name: "hero_secondary_cta", widget: "string" }


  # Medlemskap-siden
  - name: "medlemskap-page"
    label: "Medlemskap-side"
    files:
      - label: "Medlemskap"
        name: "medlemskap"
        file: "public/content/pages/medlemskap.json"
        fields:
          - { label: "Hero tittel", name: "hero_title", widget: "string", hint: "Bruk linjeskift (Enter) for å bryte tittelen i to linjer." }
          - { label: "Hero undertittel", name: "hero_subtitle", widget: "text" }
          - { label: "Hero bilde", name: "hero_image", widget: "image" }
          - { label: "Hero CTA primær", name: "hero_cta_primary", widget: "string" }
          - { label: "Hero CTA sekundær", name: "hero_cta_secondary", widget: "string" }
          - { label: "Fordeler — tittel", name: "fordeler_title", widget: "string" }
          - { label: "Fordeler — undertittel", name: "fordeler_subtitle", widget: "string" }
          - label: "Fordeler (3 kort)"
            name: "fordeler"
            widget: "list"
            min: 3
            max: 3
            fields:
              - { label: "Ikon (Material)", name: "icon", widget: "string", hint: "F.eks. 'tag', 'how_to_vote', 'event'. Se fonts.google.com/icons" }
              - { label: "Tittel", name: "title", widget: "string" }
              - { label: "Tekst", name: "text", widget: "text" }
          - { label: "Velg-tier — tittel", name: "tier_title", widget: "string" }
          - { label: "Velg-tier — undertittel", name: "tier_subtitle", widget: "string" }
          - { label: "Aktiv — bullets", name: "aktiv_features", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "Støtte — bullets", name: "stotte_features", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "Familie — badge", name: "familie_badge", widget: "string", required: false }
          - { label: "Familie — bullets", name: "familie_features", widget: "list", required: false, field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "Fysisk-disclaimer", name: "fysisk_disclaimer", widget: "text" }
          - { label: "FAQ — tittel", name: "faq_title", widget: "string" }
          - label: "FAQ — spørsmål"
            name: "faq"
            widget: "list"
            fields:
              - { label: "Spørsmål", name: "q", widget: "string" }
              - { label: "Svar", name: "a", widget: "text" }

  # Seilnummer-siden
  - name: "seilnummer-page"
    label: "Seilnummer-side"
    files:
      - label: "Seilnummer"
        name: "seilnummer"
        file: "public/content/pages/seilnummer.json"
        fields:
          - { label: "Hero badge", name: "hero_badge", widget: "string" }
          - { label: "Hero tittel", name: "hero_title", widget: "string" }
          - { label: "Hero undertittel", name: "hero_subtitle", widget: "text" }
          - { label: "Hero bilde", name: "hero_image", widget: "image" }
          - { label: "Søk-placeholder", name: "search_placeholder", widget: "string" }
          - { label: "CTA-knapp (søk)", name: "cta_button", widget: "string" }
          - { label: "Regler — eyebrow", name: "rules_eyebrow", widget: "string" }
          - { label: "Regler — tittel", name: "rules_title", widget: "string" }
          - label: "Regler (3 kort)"
            name: "rules"
            widget: "list"
            min: 3
            max: 3
            fields:
              - { label: "Ikon (Material)", name: "icon", widget: "string" }
              - { label: "Tittel", name: "title", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
              - { label: "Bullets", name: "bullets", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "Avsluttende — eyebrow", name: "cta_eyebrow", widget: "string" }
          - { label: "Avsluttende — tittel", name: "cta_title", widget: "string" }
          - { label: "Avsluttende — undertittel", name: "cta_subtitle", widget: "text" }
          - { label: "CTA primær", name: "cta_primary", widget: "string" }
          - { label: "CTA sekundær", name: "cta_secondary", widget: "string" }

  # News / Nyheter
  - name: "nyheter"
    label: "Nyheter"
    folder: "public/content/nyheter"
    format: "json"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Tittel", name: "title", widget: "string" }
      - { label: "Dato", name: "date", widget: "datetime" }
      - label: "Kategori"
        name: "category"
        widget: "select"
        options:
          - "Hoydepunkt"
          - "Nybegynner"
          - "Medlem"
          - "Regatta"
          - "Klinikk"
          - "Community"
      - { label: "Bilde", name: "image", widget: "image" }
      - { label: "Sammendrag", name: "summary", widget: "text" }
      - { label: "Innhold", name: "body", widget: "markdown" }
      - { label: "Sted", name: "location", widget: "string", required: false }

  # Events
  - name: "events"
    label: "Events"
    folder: "public/content/events"
    format: "json"
    create: true
    fields:
      - { label: "Tittel", name: "title", widget: "string" }
      - { label: "Dato", name: "date", widget: "datetime" }
      - { label: "Sluttdato", name: "end_date", widget: "datetime", required: false }
      - { label: "Sted", name: "location", widget: "string" }
      - label: "Disiplin"
        name: "discipline"
        widget: "select"
        options:
          - "Windsurfing"
          - "Wingfoil"
          - "Raceboard"
          - "iQFOiL"
          - "Bølgeseiling"
          - "Alle"
      - label: "Type"
        name: "type"
        widget: "select"
        options:
          - "Regatta"
          - "Klinikk"
          - "Community"
          - "NM"
      - { label: "Bilde", name: "image", widget: "image" }
      - { label: "Beskrivelse", name: "description", widget: "markdown" }
      - { label: "Pameldings-URL", name: "registration_url", widget: "string", required: false }
      - { label: "Fremhevet", name: "featured", widget: "boolean", default: false }

  # Clubs / Klubber
  - name: "klubber"
    label: "Klubber"
    folder: "public/content/klubber"
    format: "json"
    create: true
    fields:
      - { label: "Navn", name: "name", widget: "string" }
      - { label: "Forkortelse", name: "abbreviation", widget: "string" }
      - label: "Region"
        name: "region"
        widget: "select"
        options:
          - "Viken"
          - "Vestland"
          - "Agder"
          - "Rogaland"
          - "Troendelag"
          - "Nordland"
          - "Troms"
          - "Oslo"
      - { label: "Bilde", name: "image", widget: "image" }
      - { label: "Beskrivelse", name: "description", widget: "text" }
      - label: "Disipliner"
        name: "disciplines"
        widget: "list"
        field:
          label: "Disiplin"
          name: "discipline"
          widget: "select"
          options:
            - "Windsurfing"
            - "Wingfoil"
            - "Raceboard"
            - "iQFOiL"
            - "Wave"
            - "Freestyle"
      - { label: "Nettside", name: "website", widget: "string", required: false }
      - { label: "Kontakt e-post", name: "contact_email", widget: "string", required: false }

  # Grener / Disciplines
  - name: "grener"
    label: "Grener"
    folder: "public/content/grener"
    format: "json"
    create: true
    fields:
      - { label: "Navn", name: "name", widget: "string" }
      - { label: "Undertittel", name: "subtitle", widget: "string" }
      - { label: "Beskrivelse", name: "description", widget: "text" }
      - { label: "Bilde", name: "image", widget: "image" }
      - label: "Type"
        name: "type"
        widget: "select"
        options:
          - "Klassisk"
          - "Fremtiden"
          - "Strategi & Presisjon"
          - "Olympisk"
      - { label: "CTA tekst", name: "cta_text", widget: "string", default: "Les Mer" }
      - { label: "Rekkefolge", name: "order", widget: "number", default: 0 }
      - { label: "Detaljert beskrivelse", name: "long_description", widget: "markdown", required: false }
      - { label: "Utstyr", name: "equipment_text", widget: "text", required: false }
      - { label: "Kom i gang", name: "getting_started", widget: "text", required: false }
      - { label: "Hero-bilde (landingsside)", name: "hero_image", widget: "image", required: false }
      - label: "Galleri"
        name: "gallery"
        widget: "list"
        required: false
        field:
          label: "Bilde"
          name: "image"
          widget: "image"
      - label: "Nøkkelfakta"
        name: "key_facts"
        widget: "list"
        required: false
        fields:
          - { label: "Etikett", name: "label", widget: "string" }
          - { label: "Verdi", name: "value", widget: "string" }

  # Om Oss / About
  - name: "om-oss"
    label: "Om Oss"
    files:
      - label: "Om NBK"
        name: "about"
        file: "public/content/pages/om-oss.json"
        fields:
          - { label: "Badge", name: "badge", widget: "string", default: "Siden 1978" }
          - { label: "Tittel", name: "title", widget: "string" }
          - { label: "Undertittel", name: "subtitle", widget: "text" }
          - { label: "Hero bilde", name: "hero_image", widget: "image", required: false }
          - { label: "Historietekst", name: "history_text", widget: "text" }
          - label: "Statistikk"
            name: "stats"
            widget: "list"
            fields:
              - { label: "Tall", name: "number", widget: "string" }
              - { label: "Etikett", name: "label", widget: "string" }
          - label: "Styremedlemmer"
            name: "board_members"
            widget: "list"
            fields:
              - { label: "Navn", name: "name", widget: "string" }
              - { label: "Rolle", name: "role", widget: "string" }
              - { label: "Bilde", name: "image", widget: "image", required: false }
          - { label: "Kontakt e-post", name: "contact_email", widget: "string" }
          - { label: "Kontakt adresse", name: "contact_address", widget: "string" }

  # Site Settings
  - name: "settings"
    label: "Innstillinger"
    files:
      - label: "Sideinnstillinger"
        name: "general"
        file: "public/content/settings.json"
        fields:
          - { label: "Sidenavn", name: "site_name", widget: "string", default: "Norsk Brettseilerklubb" }
          - { label: "Kontakt e-post", name: "contact_email", widget: "string" }
          - { label: "Kontaktadresse", name: "contact_address", widget: "string" }
          - { label: "Facebook URL", name: "facebook_url", widget: "string", required: false }
          - { label: "Instagram URL", name: "instagram_url", widget: "string", required: false }
          - { label: "YouTube URL", name: "youtube_url", widget: "string", required: false }
          - { label: "Bunntekst", name: "footer_text", widget: "string" }
          - { label: "Sesongbadge", name: "season_badge", widget: "string" }

  # Dokumenter
  - name: "dokumenter"
    label: "Dokumenter"
    folder: "public/content/dokumenter"
    format: "json"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Tittel", name: "title", widget: "string" }
      - { label: "Dato", name: "date", widget: "datetime" }
      - label: "Kategori"
        name: "category"
        widget: "select"
        options:
          - "Årsmøte"
          - "Styremøte"
          - "Regnskap"
          - "Handlingsplan"
          - "Annet"
      - { label: "URL (Google Drive)", name: "url", widget: "string" }
      - { label: "Beskrivelse", name: "description", widget: "string", required: false }
      - label: "Filtype"
        name: "file_type"
        widget: "select"
        options:
          - "PDF"
          - "Google Doc"
          - "Regneark"
          - "Presentasjon"

  # Lenker
  - name: "lenker"
    label: "Lenker"
    folder: "public/content/lenker"
    format: "json"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Tittel", name: "title", widget: "string" }
      - { label: "URL", name: "url", widget: "string" }
      - { label: "Beskrivelse", name: "description", widget: "text" }
      - label: "Kategori"
        name: "category"
        widget: "select"
        options:
          - "Klasseforeninger"
          - "Vær og vind"
          - "Regelverk"
          - "Utstyr"
          - "Forbund"
          - "Annet"
      - { label: "Rekkefølge", name: "order", widget: "number", default: 0 }
